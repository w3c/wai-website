# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
      # Check for updates at 6:45am UTC. Not choosing the start of an hour to decrease the chance of delay.
      # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
      time: "06:45"
    # Allow Dependabot to open up to 10 PR
    open-pull-requests-limit: 10
    labels:
      - "submodules"
    cooldown:
      exclude:
        - "_external/resources/*"
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
      # Check for updates at 6:45am UTC. Not choosing the start of an hour to decrease the chance of delay.
      # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
      time: "06:45"
    allow:
      - dependency-name: "wai-website-theme"
      - dependency-name: "wai-website-plugin"
    cooldown:
      exclude:
        - "wai-website-theme"
        - "wai-website-plugin"
    labels:
      - "dependencies"
