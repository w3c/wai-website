name: Build-only

on:
  workflow_dispatch
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        submodules: true
        fetch-depth: 0
    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 #v1.338.0
      with:
        ruby-version: 3.4.12
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Build and test with Jekyll
      run: |
        bundle exec jekyll build --verbose --trace --config "_config.yml,_config_prod.yml" --profile
    - name: Generate list of resources
      run: |
        find ./_site -type f | sed 's,^\.\/_site,,' | sort > ./_site/manifest.txt
    - name: check output
      run: |
        ls -la _site
