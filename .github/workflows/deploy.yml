name: Deploy

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        submodules: true
        fetch-depth: 0
    - name: Set up Ruby 3.4.8
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b #v1.321.0
      with:
        ruby-version: '3.4.8' # matches Netlify ruby version
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Build and test with Jekyll
      run: |
        export WAI_LIVE_SITE=true
        bundle exec jekyll build --config "_config.yml,_config_prod.yml" --profile
    - name: Generate list of resources
      run: |
        find ./_site -type f | sed 's,^\.\/_site,,' | sort > ./_site/manifest.txt
    - name: Publish to gh-pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 #v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: _site
    - name: Zip Files
      uses: montudor/action-zip@0852c26906e00f8a315c704958823928d8018b28 #v1.0.0
      with:
        args: zip -r build.zip ./_site
    - name: Upload zip file to release
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de #v2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: build.zip
        asset_name: build.zip
        tag: ${{ github.ref }}
        overwrite: true
    - name: Wait for gh-pages to be updated
      run: sleep 90s
      shell: bash
    - name: Update URL mapping on W3C site
      uses: fjogeleit/http-request-action@f98bb26551cd1af7d3eb2674578a80754ece88db #v2.0.1
      with:
        url: 'https://www.w3.org/services/update-wai-map'
        method: 'POST'
        timeout: 70000
